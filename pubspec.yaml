
name: ekrili_karhba
description: Ekrili Karhba vehicle rental and reservation application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

  # Reservation module
  sqflite: ^2.4.5
  path: ^1.9.1
  intl: ^0.20.3
  http: ^1.6.0

  # Vehicles module
  crypto: ^3.0.3
  image_picker: ^1.2.4
  path_provider: ^2.1.6

  # Firebase and notifications
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  googleapis_auth: ^2.3.5
  flutter_local_notifications: ^22.3.3

  # French localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fcm/
